<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Korea Hotspots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h1>South Korea Hotspots</h1>
                <p>Explore curated destinations or submit a new location with custom tags.</p>
            </div>
            <nav>
                <a href="hotspot.html" style="color: var(--badge-text); text-decoration: none; font-weight: 600;">Browse Hotspots &rarr;</a>
            </nav>
        </div>
    </header>

    <!-- Add New Hotspot Form -->
    <section class="form-section">
        <h2>Add a Hotspot</h2>
        <form id="addHotspotForm">
            <div class="form-grid">
                <div class="control-group">
                    <label for="newName">Name</label>
                    <input type="text" id="newName" placeholder="e.g. Olive Young Myeongdong" required>
                </div>
                <div class="control-group">
                    <label for="newCity">City</label>
                    <select id="newCity">
                        <option value="Seoul">Seoul</option>
                        <option value="Busan">Busan</option>
                        <option value="Jeju">Jeju</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="newCategory">Primary Category</label>
                    <select id="newCategory">
                        <option value="Food">Food</option>
                        <option value="Landmark">Landmark</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Nature">Nature</option>
                    </select>
                </div>
                <div class="control-group" style="grid-column: 1 / -1;">
                    <label for="newDescription">Description</label>
                    <input type="text" id="newDescription" placeholder="Short description of the location..." required>
                </div>

                <!-- Tag Selection & Creation -->
                <div class="control-group" style="grid-column: 1 / -1;">
                    <label>Tags (Click to select or create a new tag)</label>
                    <div id="tagSelector" class="tag-list"></div>

                    <div class="custom-tag-row">
                        <input type="text" id="customTagInput" placeholder="New tag name (e.g. Cafe, Nightlife)...">
                        <button type="button" id="createTagBtn" class="btn-secondary">+ Create Tag</button>
                    </div>
                </div>
            </div>
            <button type="submit">Add Location &amp; View Directory</button>
        </form>
    </section>

    <script>
        const HOTSPOTS_KEY = "korea_hotspots_custom";
        const TAGS_KEY = "korea_hotspots_tags";
        const DEFAULT_TAGS = ["Scenery", "Shopping", "Beauty"];

        // Load saved tag list or initialize with basic tags
        let availableTags = JSON.parse(localStorage.getItem(TAGS_KEY)) || [...DEFAULT_TAGS];
        const selectedTags = new Set();

        const tagSelector = document.getElementById("tagSelector");
        const customTagInput = document.getElementById("customTagInput");
        const createTagBtn = document.getElementById("createTagBtn");
        const addHotspotForm = document.getElementById("addHotspotForm");

        function renderTagPills() {
            tagSelector.innerHTML = "";
            availableTags.forEach(tag => {
                const pill = document.createElement("span");
                pill.className = "tag-pill selectable" + (selectedTags.has(tag) ? " selected" : "");
                pill.textContent = selectedTags.has(tag) ? `✓ ${tag}` : tag;

                pill.addEventListener("click", () => {
                    if (selectedTags.has(tag)) {
                        selectedTags.delete(tag);
                    } else {
                        selectedTags.add(tag);
                    }
                    renderTagPills();
                });

                tagSelector.appendChild(pill);
            });
        }

        function addNewTag() {
            const raw = customTagInput.value.trim();
            if (!raw) return;

            // Format cleanly (capitalize first letter)
            const formatted = raw.charAt(0).toUpperCase() + raw.slice(1);

            // Prevent case-insensitive duplicates
            const existing = availableTags.find(t => t.toLowerCase() === formatted.toLowerCase());
            if (existing) {
                selectedTags.add(existing);
            } else {
                availableTags.push(formatted);
                localStorage.setItem(TAGS_KEY, JSON.stringify(availableTags));
                selectedTags.add(formatted);
            }

            customTagInput.value = "";
            renderTagPills();
        }

        createTagBtn.addEventListener("click", addNewTag);
        customTagInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter") {
                event.preventDefault();
                addNewTag();
            }
        });

        addHotspotForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const existingCustom = JSON.parse(localStorage.getItem(HOTSPOTS_KEY)) || [];

            const newSpot = {
                id: Date.now(),
                name: document.getElementById("newName").value.trim(),
                city: document.getElementById("newCity").value,
                category: document.getElementById("newCategory").value,
                description: document.getElementById("newDescription").value.trim(),
                tags: Array.from(selectedTags)
            };

            existingCustom.push(newSpot);
            localStorage.setItem(HOTSPOTS_KEY, JSON.stringify(existingCustom));

            window.location.href = "hotspot.html";
        });

        renderTagPills();
    </script>
</body>
</html>
