<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>South Korea Hotspots</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div>
                <h1>South Korea Hotspots Directory</h1>
                <p>Filter and search locations across South Korea.</p>
            </div>
            <nav>
                <a href="hotspot.html" style="color: var(--badge-text); text-decoration: none; font-weight: 600;">View Added Hotspots &rarr;</a>
            </nav>
        </div>
    </header>

    <!-- Controls -->
    <section class="controls">
        <div class="control-group">
            <label for="cityFilter">Filter by City</label>
            <select id="cityFilter">
                <option value="All">All Cities</option>
                <option value="Seoul">Seoul</option>
                <option value="Busan">Busan</option>
                <option value="Jeju">Jeju</option>
            </select>
        </div>

        <div class="control-group">
            <label for="categoryFilter">Category</label>
            <select id="categoryFilter">
                <option value="All">All Categories</option>
                <option value="Food">Food</option>
                <option value="Landmark">Landmark</option>
                <option value="Shopping">Shopping</option>
                <option value="Nature">Nature</option>
            </select>
        </div>

        <div class="control-group">
            <label for="searchInput">Search</label>
            <input type="text" id="searchInput" placeholder="Type name or keyword...">
        </div>
    </section>

    <!-- Results Summary -->
    <p id="resultCount" class="result-count"></p>

    <!-- Hotspot List Output -->
    <main id="hotspotList" class="hotspot-grid"></main>

    <!-- Add New Hotspot Form -->
    <section class="form-section">
        <h2>Add a Hotspot</h2>
        <form id="addHotspotForm">
            <div class="form-grid">
                <div class="control-group">
                    <label for="newName">Name</label>
                    <input type="text" id="newName" required>
                </div>
                <div class="control-group">
                    <label for="newCity">City</label>
                    <select id="newCity">
                        <option value="Seoul">Seoul</option>
                        <option value="Busan">Busan</option>
                        <option value="Jeju">Jeju</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="newCategory">Category</label>
                    <select id="newCategory">
                        <option value="Food">Food</option>
                        <option value="Landmark">Landmark</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Nature">Nature</option>
                    </select>
                </div>
                <div class="control-group">
                    <label for="newDescription">Description</label>
                    <input type="text" id="newDescription" required>
                </div>
            </div>
            <button type="submit">Add Location</button>
        </form>
    </section>

    <script>
        // JSON Data Store
        const hotspots = [
            {
                id: 1,
                name: "Gwangjang Market",
                city: "Seoul",
                category: "Food",
                description: "Historic traditional street market famous for bindaetteok (mung bean pancakes) and mayak gimbap."
            },
            {
                id: 2,
                name: "Gyeongbokgung Palace",
                city: "Seoul",
                category: "Landmark",
                description: "Main royal palace of the Joseon dynasty with changing of the guard ceremonies."
            },
            {
                id: 3,
                name: "Seongsu-dong",
                city: "Seoul",
                category: "Shopping",
                description: "Industrial warehouse district converted into flagship fashion stores and specialty cafes."
            },
            {
                id: 4,
                name: "Gamcheon Culture Village",
                city: "Busan",
                category: "Landmark",
                description: "Hillside neighborhood known for colorful terraced houses, murals, and alleys."
            },
            {
                id: 5,
                name: "Haeundae Beach",
                city: "Busan",
                category: "Nature",
                description: "Popular urban coastline surrounded by skyscrapers and seafood restaurants."
            },
            {
                id: 6,
                name: "Seongsan Ilchulbong",
                city: "Jeju",
                category: "Nature",
                description: "Volcanic tuff cone crater offering coastal hiking trails and sunrise views."
            }
        ];

        const cityFilter = document.getElementById("cityFilter");
        const categoryFilter = document.getElementById("categoryFilter");
        const searchInput = document.getElementById("searchInput");
        const hotspotList = document.getElementById("hotspotList");
        const resultCount = document.getElementById("resultCount");
        const addHotspotForm = document.getElementById("addHotspotForm");

        function renderHotspots() {
            const selectedCity = cityFilter.value;
            const selectedCategory = categoryFilter.value;
            const query = searchInput.value.trim().toLowerCase();

            const filtered = hotspots.filter(spot => {
                const matchesCity = selectedCity === "All" || spot.city === selectedCity;
                const matchesCategory = selectedCategory === "All" || spot.category === selectedCategory;
                const matchesQuery = spot.name.toLowerCase().includes(query) ||
                                     spot.description.toLowerCase().includes(query);
                return matchesCity && matchesCategory && matchesQuery;
            });

            resultCount.textContent = `Showing ${filtered.length} of ${hotspots.length} hotspots`;
            hotspotList.innerHTML = "";

            if (filtered.length === 0) {
                hotspotList.innerHTML = "<p>No hotspots match your filters.</p>";
                return;
            }

            filtered.forEach(spot => {
                const item = document.createElement("article");
                item.className = "card";
                item.innerHTML = `
                    <div class="card-header">
                        <h3>${spot.name}</h3>
                        <span class="badge">${spot.category}</span>
                    </div>
                    <div class="city-label">${spot.city}</div>
                    <p>${spot.description}</p>
                `;
                hotspotList.appendChild(item);
            });
        }

        // Event Listeners for Live Filtering
        cityFilter.addEventListener("change", renderHotspots);
        categoryFilter.addEventListener("change", renderHotspots);
        searchInput.addEventListener("input", renderHotspots);

        // Handle Adding New Entries
        addHotspotForm.addEventListener("submit", (event) => {
            event.preventDefault();

            const newSpot = {
                id: hotspots.length + 1,
                name: document.getElementById("newName").value.trim(),
                city: document.getElementById("newCity").value,
                category: document.getElementById("newCategory").value,
                description: document.getElementById("newDescription").value.trim()
            };

            hotspots.push(newSpot);
            addHotspotForm.reset();
            renderHotspots();
        });

        // Initial Render
        renderHotspots();
    </script>
</body>
</html>
